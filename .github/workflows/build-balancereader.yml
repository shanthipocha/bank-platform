name: build-balancereader
on:
  push:
    branches: [main]
    paths:
      - 'src/ledger/balancereader/**'
      - 'pom.xml'
      - '.mvn/**'
      - '.github/workflows/build-balancereader.yml'
  pull_request:
    paths:
      - 'src/ledger/balancereader/**'
      - 'pom.xml'
      - '.mvn/**'
      - '.github/workflows/build-balancereader.yml'

permissions:
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/balancereader
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Code style and unit tests
        run: |
          chmod +x mvnw
          ./mvnw -B -pl src/ledger/balancereader -am checkstyle:check test

      - name: Build image with Jib
        run: |
          ./mvnw -B -pl src/ledger/balancereader -am compile \
            jib:dockerBuild -Djib.to.image="$IMAGE:$TAG"

      - name: Trivy image scan (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:$TAG"
