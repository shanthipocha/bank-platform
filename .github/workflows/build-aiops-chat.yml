name: build-aiops-chat
on:
  push:
    branches: [main]
    paths:
      - 'aiops-chat/**'
      - '.github/workflows/build-aiops-chat.yml'
  pull_request:
    paths:
      - 'aiops-chat/**'
      - '.github/workflows/build-aiops-chat.yml'

permissions:
  contents: read

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/aiops-chat
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t "$IMAGE:$TAG" aiops-chat

      - name: Trivy report (HIGH and CRITICAL, informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table

      - name: Trivy gate (fail on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Log in to GHCR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name == 'push'
        run: docker push "$IMAGE:$TAG"
