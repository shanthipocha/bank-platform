apiVersion: v1
kind: ServiceAccount
metadata: { name: aiops, namespace: monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: aiops-read, namespace: default }
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: aiops-read, namespace: default }
subjects: [{ kind: ServiceAccount, name: aiops, namespace: monitoring }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aiops-read }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aiops, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: aiops } }
  template:
    metadata: { labels: { app: aiops } }
    spec:
      serviceAccountName: aiops
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: aiops
          image: python:3.12-slim
          command: ["python", "-u", "/app/app.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - name: CRIT_URL
              valueFrom: { secretKeyRef: { name: alertmanager-slack, key: critical-url } }
            - name: WARN_URL
              valueFrom: { secretKeyRef: { name: alertmanager-slack, key: warning-url } }
          envFrom: [{ secretRef: { name: aiops-llm, optional: true } }]
          ports: [{ containerPort: 8080 }]
          volumeMounts: [{ name: code, mountPath: /app }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 40Mi }
            limits: { memory: 128Mi }
      volumes: [{ name: code, configMap: { name: aiops-code } }]
---
apiVersion: v1
kind: Service
metadata: { name: aiops, namespace: monitoring }
spec:
  selector: { app: aiops }
  ports: [{ port: 8080, targetPort: 8080 }]
