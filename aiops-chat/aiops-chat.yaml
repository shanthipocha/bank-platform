apiVersion: v1
kind: ServiceAccount
metadata: { name: aiops-chat, namespace: monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: aiops-chat-read, namespace: default }
subjects: [{ kind: ServiceAccount, name: aiops-chat, namespace: monitoring }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: aiops-read }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: aiops-chat, namespace: monitoring }
spec:
  replicas: 1
  selector: { matchLabels: { app: aiops-chat } }
  template:
    metadata: { labels: { app: aiops-chat } }
    spec:
      serviceAccountName: aiops-chat
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: aiops-chat
          image: ghcr.io/shanthipocha/bank-platform/aiops-chat:f658b1125488ce9f0348f70c9bec7215aea964f0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: { name: aiops-chat-slack }
            - secretRef: { name: aiops-llm, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 60Mi }
            limits: { memory: 160Mi }
