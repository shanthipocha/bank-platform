apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elasticsearch
  namespace: logging
spec:
  version: 9.2.0
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false   # avoids the vm.max_map_count sysctl on kind/WSL
      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              env:
                - { name: ES_JAVA_OPTS, value: "-Xms768m -Xmx768m" }
              resources:
                requests: { cpu: 200m, memory: 1Gi }
                limits: { memory: 1536Mi }
      volumeClaimTemplates:
        - metadata: { name: elasticsearch-data }
          spec:
            accessModes: [ReadWriteOnce]
            resources: { requests: { storage: 5Gi } }
---
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging
spec:
  version: 9.2.0
  count: 1
  elasticsearchRef:
    name: elasticsearch
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests: { cpu: 100m, memory: 700Mi }
            limits: { memory: 1Gi }
