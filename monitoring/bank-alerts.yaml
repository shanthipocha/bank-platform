apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bank-alerts
  namespace: monitoring
spec:
  groups:
    - name: bank.rules
      rules:
        - alert: BankDatabaseDown
          expr: kube_statefulset_status_replicas_ready{namespace="default",statefulset=~"accounts-db|ledger-db"} < 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Database {{ $labels.statefulset }} has no ready replicas"
            description: "Bank of Anthos {{ $labels.statefulset }} is down. Logins or transactions will fail."
        - alert: BankPodCrashLooping
          expr: kube_pod_container_status_waiting_reason{namespace="default",reason="CrashLoopBackOff"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} in {{ $labels.pod }} is in CrashLoopBackOff."
        - alert: BankServiceUnavailable
          expr: kube_deployment_status_replicas_available{namespace="default"} < kube_deployment_spec_replicas{namespace="default"}
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ $labels.deployment }} is below desired replicas"
            description: "{{ $labels.deployment }} has fewer available replicas than desired for 3 minutes."
        - alert: BankHighRestartRate
          expr: increase(kube_pod_container_status_restarts_total{namespace="default"}[15m]) > 3
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} restarted more than 3 times in 15 minutes"
            description: "Container {{ $labels.container }} keeps restarting."
