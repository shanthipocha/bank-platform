alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-slack
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: aiops
          matchers: ['alertname=~"Bank.*"']
          continue: true
        - receiver: "null"
          matchers: ['alertname=~"Watchdog|InfoInhibitor"']
        - receiver: slack-critical
          matchers: ['severity="critical"']
          repeat_interval: 1h
        - receiver: slack-warning
          matchers: ['severity="warning"']
    receivers:
      - name: "null"
      - name: aiops
        webhook_configs:
          - url: http://aiops.monitoring.svc:8080/alert
            send_resolved: false
      - name: slack-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/critical-url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🔴 CRITICAL{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}
      - name: slack-warning
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/warning-url
            send_resolved: true
            title: '{{ if eq .Status "firing" }}🟠 WARNING{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
            text: |-
              {{ range .Alerts }}*{{ .Annotations.summary }}*
              {{ .Annotations.description }}
              {{ end }}
