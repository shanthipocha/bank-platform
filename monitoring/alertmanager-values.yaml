alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-slack   # mounted at /etc/alertmanager/secrets/alertmanager-slack/
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname=~"Watchdog|InfoInhibitor"']
        - receiver: slack-critical
          matchers: ['severity="critical"']
          repeat_interval: 1h
        - receiver: slack-warning
          matchers: ['severity="warning"']
    receivers:
      - name: "null"
      - name: slack-critical
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/critical-url
            send_resolved: true
      - name: slack-warning
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/warning-url
            send_resolved: true
